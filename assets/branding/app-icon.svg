<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>CarDex App Icon</title>
  <!-- Brand Red Hardware Background -->
  <rect width="1024" height="1024" fill="#DC2626"/>

  <!-- Subtle Hardware Bevel Border Accent -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="none" stroke="#B91C1C" stroke-width="8" opacity="0.6"/>

  <!-- Center Group: Optical Aperture Sensor -->
  <g transform="translate(512, 512) scale(2.8) translate(-128, -128)">
    <!-- Outer Instrument Bezel -->
    <circle cx="128" cy="128" r="116" fill="#181E29" stroke="#991B1B" stroke-width="6"/>

    <!-- Sensor Well -->
    <circle cx="128" cy="128" r="96" fill="#0F172A"/>

    <!-- 4 Sighting Calipers -->
    <polygon points="128,40 140,74 116,74" fill="#DC2626"/>
    <polygon points="128,216 140,182 116,182" fill="#DC2626"/>
    <polygon points="40,128 74,116 74,140" fill="#DC2626"/>
    <polygon points="216,128 182,116 182,140" fill="#DC2626"/>

    <!-- Spherical Cobalt Sensor Lens -->
    <circle cx="128" cy="128" r="64" fill="#0284C7"/>
    <circle cx="128" cy="128" r="40" fill="#0369A1"/>

    <!-- Specular Lens Glint -->
    <circle cx="110" cy="110" r="14" fill="#FFFFFF"/>
    <circle cx="146" cy="146" r="6" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
