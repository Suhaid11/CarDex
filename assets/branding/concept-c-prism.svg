<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Circular Bezel -->
  <circle cx="128" cy="128" r="120" fill="#181E29" stroke="#991B1B" stroke-width="8"/>

  <!-- Hexagonal Prismatic Shutter Faces -->
  <!-- Top Face (Red Hardware) -->
  <polygon points="128,40 204,84 128,128 52,84" fill="#DC2626"/>
  <!-- Right Face (Cobalt Sensor Blue) -->
  <polygon points="128,128 204,84 204,172 128,216" fill="#0284C7"/>
  <!-- Left Face (Dark Slate Chassis) -->
  <polygon points="52,84 128,128 128,216 52,172" fill="#0F172A"/>

  <!-- Central Optical Core -->
  <circle cx="128" cy="128" r="32" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="120" cy="120" r="10" fill="#FFFFFF"/>
</svg>
