  <!-- Sighting Crosshair Notches -->
  <line x1="128" y1="56" x2="128" y2="82" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <line x1="128" y1="174" x2="128" y2="200" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <line x1="56" y1="128" x2="82" y2="128" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <line x1="174" y1="128" x2="200" y2="128" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>

  <!-- Central Optical Core Dot -->
  <circle cx="128" cy="128" r="22" fill="#0284C7"/>
  <circle cx="122" cy="122" r="6" fill="#FFFFFF"/>
</svg>
